[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoatmosim"
version = "0.9.28.11"
description = "Modular exoplanet high-resolution spectroscopy predictions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "astropy>=5.3", "chemformula>=1.4"]

[project.scripts]
exoatmosim = "exoatmosim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
nasa = ["astroquery", "astropy", "numpy"]
plots = ["matplotlib>=3.6"]
orbits = ["astropy", "radvel", "PyAstronomy", "matplotlib>=3.6"]
tellurics = ["h5py>=3.8"]

[tool.setuptools.package-data]
"exoatmosim.resources.instruments" = ["*.npy", "*.npz"]

